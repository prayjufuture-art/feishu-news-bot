name: Feishu News Bot

on:
  schedule:
    # 每天北京时间 09:00 运行
    # GitHub Actions 的 cron 使用 UTC 时间，所以这里是 UTC 01:00
    - cron: "0 1 * * *"

  workflow_dispatch: # 允许手动点击 Run workflow 运行

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests

      - name: Run Feishu News Bot
        run: python bot.py
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
